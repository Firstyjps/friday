<!doctype html>
<html lang="th" translate="no">
<head>
<meta charset="utf-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Friday">
<meta name="theme-color" content="#0b0d10">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Friday</title>
<style>
  :root { --bg:#0b0d10; --fg:#e8eaed; --dim:#8a9099; --accent:#ff7a1a; --warn:#ffc84a; --me:#263241; --lvl:0; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; }
  body { margin:0; background:var(--bg); color:var(--fg);
         font:16px/1.5 "Sukhumvit Set", -apple-system, system-ui, sans-serif;
         display:flex; flex-direction:column; align-items:center; gap:0;
         padding:calc(env(safe-area-inset-top) + 24px) 20px calc(env(safe-area-inset-bottom) + 16px); }
  h1 { font-weight:600; letter-spacing:.3em; margin:0 0 8px; font-size:13px; color:var(--dim); }

  /* orb + วงเรืองแสงตามระดับเสียง (--lvl 0..1 ตั้งจาก app.js) */
  #orbWrap { position:relative; width:200px; height:200px; margin:24px 0 20px; flex:none; }
  #orbWrap::before { content:""; position:absolute; inset:-28px; border-radius:50%;
         background:radial-gradient(circle, rgba(255,122,26,.32), rgba(255,122,26,0) 70%);
         opacity:0; transition:opacity .3s, transform .12s; transform:scale(calc(.85 + var(--lvl) * .35)); }
  #orbWrap.live::before { opacity:1; }
  #orb { position:absolute; inset:0; width:200px; height:200px; border-radius:50%; border:0; padding:0; cursor:pointer;
         background:radial-gradient(circle at 35% 30%, #ffb070, var(--accent) 45%, #7a2d00);
         box-shadow:0 0 40px rgba(255,122,26,.5);
         transition:transform .12s, filter .3s; filter:grayscale(1) brightness(.55);
         transform:scale(calc(1 + var(--lvl) * .06)); }
  #orbWrap.live #orb { filter:none; }
  #orbWrap.speaking #orb { animation:pulse 1.1s ease-in-out infinite; }
  @keyframes pulse { 50% { box-shadow:0 0 70px rgba(255,122,26,.8); } }

  #status { font-size:16px; font-weight:500; text-align:center; min-height:1.5em; }
  #meta { color:var(--dim); font-size:13px; min-height:1.5em; font-variant-numeric:tabular-nums; }

  #log { width:100%; max-width:560px; margin-top:16px; display:flex; flex-direction:column; gap:10px; overflow-y:auto; flex:1; justify-content:flex-end; }
  .me, .fri { padding:10px 14px; max-width:85%; white-space:pre-wrap; font-size:15px; line-height:1.45; }
  .me { align-self:flex-end; background:var(--me); border-radius:16px 16px 4px 16px; }
  .fri { align-self:flex-start; background:rgba(255,122,26,.18); border-radius:16px 16px 16px 4px; }
  .sys { align-self:center; color:var(--dim); font-size:13px; text-align:center; }
  .job { align-self:stretch; display:flex; align-items:center; gap:8px; padding:8px 12px; border-radius:12px; background:rgba(255,255,255,.05); color:#c9ced6; font-size:13px; text-align:left; }
  .job .spin { width:12px; height:12px; border-radius:50%; border:2px solid rgba(255,122,26,.25); border-top-color:var(--accent); animation:spin .9s linear infinite; flex:none; }
  @keyframes spin { to { transform:rotate(360deg); } }

  /* การ์ดยืนยัน */
  .confirm { align-self:stretch; color:var(--fg); background:rgba(255,184,0,.08); border:1px solid rgba(255,184,0,.45);
             padding:14px; border-radius:16px; display:flex; flex-direction:column; gap:12px; text-align:left; font-size:15px; }
  .confirm .title { display:flex; align-items:center; gap:8px; font-size:13px; font-weight:600; color:var(--warn); }
  .confirm .title .left { margin-left:auto; font-weight:400; color:var(--dim); font-variant-numeric:tabular-nums; }
  .confirm .cmd { font:12px/1.5 ui-monospace, "SF Mono", Menlo, monospace; background:rgba(0,0,0,.35); padding:10px; border-radius:10px; word-break:break-all; }
  .confirm .hint { font-size:12px; color:var(--dim); }
  .btns { display:flex; gap:10px; }
  .btns button { flex:1; height:48px; font:inherit; font-size:15px; border-radius:12px; border:0; cursor:pointer; background:rgba(255,255,255,.08); color:var(--fg); }
  .btns button:first-child { background:var(--accent); color:#1a0d00; font-weight:600; }

  /* แถบล่าง */
  #bar { width:100%; max-width:560px; display:flex; justify-content:space-between; align-items:center; padding-top:12px; flex:none; }
  #bar button { width:48px; height:48px; border-radius:50%; border:0; background:rgba(255,255,255,.06); color:var(--fg); cursor:pointer; display:flex; align-items:center; justify-content:center; }
  #bar button.on { background:rgba(255,122,26,.25); color:var(--accent); }
  #bar button:disabled { opacity:.35; }
  #hint { color:var(--dim); font-size:13px; text-align:center; }
</style>
</head>
<body>
  <h1>FRIDAY</h1>
  <div id="orbWrap"><button id="orb" aria-label="เริ่ม/หยุดคุย"></button></div>
  <div id="status">แตะวงกลมเพื่อเริ่มคุย</div>
  <div id="meta"></div>
  <div id="log"></div>
  <div id="bar">
    <button id="muteBtn" aria-label="ปิด/เปิดไมค์" disabled>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="9" y="2" width="6" height="12" rx="3"></rect><path d="M6 11a6 6 0 0 0 12 0M12 17v4"></path></svg>
    </button>
    <div id="hint">แตะวงกลมเพื่อเริ่ม · แตะอีกครั้งเพื่อจบ</div>
    <button id="endBtn" aria-label="จบการคุย" disabled>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"></path></svg>
    </button>
  </div>
  <script type="module" src="app.js"></script>
</body>
</html>
